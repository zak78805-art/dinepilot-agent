services:
  redis:
    image: redis:7-alpine
    container_name: sky-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sky-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sky-agent-api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      STATE_STORE_MODE: redis
      REDIS_URL: redis://redis:6379/1
      SKY_BACKEND_BASE_URL: ${SKY_BACKEND_BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
