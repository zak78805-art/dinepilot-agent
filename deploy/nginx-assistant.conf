# Included inside the existing admin server {} block. This local demo is loopback-only.
location = /assistant {
    return 302 /assistant/;
}

location ^~ /assistant/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    alias D:/sky-agent/web/;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
    }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

location = /assistant-api/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8090/health;
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}

location ^~ /assistant-api/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8090/api/agent/;
    proxy_set_header Host $host;
    proxy_set_header token $http_token;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header authentication $http_authentication;
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
